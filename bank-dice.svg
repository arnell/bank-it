<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="512"
     height="512" viewBox="0 0 32 32" xml:space="preserve">
    <!-- Outline -->
    <g transform="matrix(1 0 0 1 16 16)" id="dice-outline">
        <rect style="stroke: rgb(0,0,0); fill: rgb(20,20,20);"
              vector-effect="non-scaling-stroke" x="-33.085" y="-33.085" rx="2" ry="2" width="66.17" height="66.17"/>
    </g>
    <!-- Roof -->
    <g transform="matrix(1.2 0 0 1.2 16 6.7)" id="roof">
        <polygon
            style="fill: rgb(52,152,219);"
            vector-effect="non-scaling-stroke" points="-12,4 0,-4 12,4 "/>
    </g>
    <!-- Roof lip -->
    <g transform="matrix(1.8 0 0 1.2 16 12)" id="roof-lip">
        <rect style="fill: rgb(52,152,219);"
              vector-effect="non-scaling-stroke" x="-8" y="-0.5" rx="0" ry="0" width="16" height="1"/>
    </g>
    <!-- Dice outline (inner) -->
    <g transform="matrix(0.65 0 0 0.65 16 8)" id="dice-inner">
        <rect style="fill: rgb(20,20,20);"
              vector-effect="non-scaling-stroke" x="-5" y="-5" rx="2" ry="2" width="10" height="10"/>
    </g>
    <!-- Dice dot -->
    <g transform="matrix(0.7 0 0 0.7 14.5 6.5)" id="dice-dot-1">
        <circle style="fill: rgb(255,255,255);"
                vector-effect="non-scaling-stroke" cx="0" cy="0" r="1"/>
    </g>
    <!-- Dice dot -->
    <g transform="matrix(0.7 0 0 0.7 16 8)" id="dice-dot-2">
        <circle style="fill: rgb(255,255,255);"
                vector-effect="non-scaling-stroke" cx="0" cy="0" r="1"/>
    </g>
    <!-- Dice dot -->
    <g transform="matrix(0.7 0 0 0.7 17.5 9.5)" id="dice-dot-3">
        <circle style="fill: rgb(255,255,255);"
                vector-effect="non-scaling-stroke" cx="0" cy="0" r="1"/>
    </g>
    <!-- Pillar (left) -->
    <g transform="matrix(2 0 0 1.2 6 20.1)" id="pillar-left">
        <rect style="fill: rgb(52,152,219);"
              vector-effect="non-scaling-stroke" x="-1" y="-6" rx="0" ry="0" width="2" height="12"/>
    </g>
    <!-- Pillar (center) -->
    <g transform="matrix(2 0 0 1.2 16 20.1)" id="pillar-center">
        <rect style="fill: rgb(52,152,219);"
              vector-effect="non-scaling-stroke" x="-1" y="-6" rx="0" ry="0" width="2" height="12"/>
    </g>
    <!-- Pillar (right) -->
    <g transform="matrix(2 0 0 1.2 26 20.1)" id="pillar-right">
        <rect style="fill: rgb(52,152,219);"
              vector-effect="non-scaling-stroke" x="-1" y="-6" rx="0" ry="0" width="2" height="12"/>
    </g>
    <!-- Step -->
    <g transform="matrix(1.5 0 0 1.2 16 28.25)" id="steps-1">
        <rect style="fill: rgb(52,152,219);"
              vector-effect="non-scaling-stroke" x="-8" y="-0.5" rx="0" ry="0" width="16" height="1"/>
    </g>
    <!-- Step -->
    <g transform="matrix(2 0 0 1.2 16 29.8)" id="steps-2">
        <rect style="fill: rgb(52,152,219);"
              vector-effect="non-scaling-stroke" x="-7" y="-0.5" rx="0" ry="0" width="14" height="1"/>
    </g>
</svg>